name: Refresh vehicle history and recalls

on:
  schedule:
    # Mondays 07:23 UTC (02:23 Toronto in winter), after Transport Canada's monthly file is usually posted.
    - cron: '23 7 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Test the pipeline
        run: node --test scripts/enrich.test.mjs
      - name: Enrich vehicles.json
        env:
          # Leave these unset until you have CARFAX Canada API access; the CARFAX step then skips.
          CARFAX_API_URL: ${{ secrets.CARFAX_API_URL }}
          CARFAX_API_KEY: ${{ secrets.CARFAX_API_KEY }}
          CARFAX_AUTH_HEADER: ${{ vars.CARFAX_AUTH_HEADER }}
        run: node scripts/enrich.mjs
      - name: Commit if anything changed
        id: commit
        run: |
          if git diff --quiet -- src/data/vehicles.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/vehicles.json
          git commit -m "data: refresh vehicle history and recalls"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

  deploy:
    needs: refresh
    if: needs.refresh.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
